name: monthly-refresh

on:
  schedule:
    - cron: "0 1 20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install chronos-forecasting
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-2
      - name: Download Pink Sheet (best effort; URL changes occasionally)
        continue-on-error: true
        run: |
          mkdir -p data/raw
          curl -fL -o data/raw/pink_sheet_monthly.xlsx "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Monthly.xlsx"
      - name: Refresh
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: bash scripts/refresh.sh
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="data/processed docs/figs docs/briefs"
          tmp=$(mktemp -d)
          cp -r data/processed docs/figs docs/briefs "$tmp"/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data/processed docs/figs docs/briefs
          mkdir -p data docs
          cp -r "$tmp"/processed data/
          cp -r "$tmp"/figs "$tmp"/briefs docs/
          git add $OUT
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: monthly data refresh $(date -u +%Y-%m)"
          git push origin main
